version: '3.8'

services:
  # Backend — .NET API
  backend:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: chamados-backend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    command: dotnet run --project src/ChamadosCamarj.WebApi
    networks:
      - chamados-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend — React + Vite
  frontend:
    image: node:20-alpine
    container_name: chamados-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - chamados-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  chamados-network:
    driver: bridge
