version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: chamados-postgres
    environment:
      POSTGRES_DB: chamadoscamarj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chamados-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend — .NET API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chamados-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=chamadoscamarj;User Id=postgres;Password=postgres123;
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chamados-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend — React + Vite
  frontend:
    image: node:20-alpine
    container_name: chamados-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - chamados-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  chamados-network:
    driver: bridge
