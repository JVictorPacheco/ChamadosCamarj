name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: chamadoscamarj-api
  AZURE_WEBAPP_PACKAGE_PATH: './published'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/ChamadosCamarj.WebApi/ChamadosCamarj.WebApi.csproj

      - name: Build
        run: dotnet build src/ChamadosCamarj.WebApi/ChamadosCamarj.WebApi.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ChamadosCamarj.UnitTests/ChamadosCamarj.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/ChamadosCamarj.WebApi/ChamadosCamarj.WebApi.csproj --configuration Release --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
